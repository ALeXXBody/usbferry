name: build-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run test suites
        run: |
          python3 tests/test_loopback.py
          python3 tests/test_gui.py
          python3 tests/test_localserver.py

  windows-exe:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exes
        shell: pwsh
        run: |
          pip install pyinstaller pywebview pythonnet cryptography
          python tools/make_version_info.py
          # GUI exe: windowed (no console window at all), GUI is the default command
          pyinstaller --onefile --windowed --name usbferry `
            --icon assets/usbferry.ico `
            --version-file build/version-info.txt `
            --collect-all webview `
            --add-data "web/index.html;web" `
            --add-data "web/app.html;web" `
            usbferry-cli.py
          # CLI exe: console, for terminal users (all subcommands)
          pyinstaller --onefile --console --name usbferry-cli `
            --icon assets/usbferry.ico `
            --version-file build/version-info.txt `
            --collect-all webview `
            --add-data "web/index.html;web" `
            --add-data "web/app.html;web" `
            usbferry-cli.py

      - name: Checksums
        shell: pwsh
        run: |
          $hashes = Get-FileHash -Algorithm SHA256 dist\*.exe | ForEach-Object {
            "$($_.Hash)  $(Split-Path -Leaf $_.Path)"
          }
          $hashes | Out-File -Encoding ascii dist\checksums.txt
          Get-Content dist\checksums.txt

      - name: Smoke test
        shell: pwsh
        run: |
          dist\usbferry-cli.exe --version
          dist\usbferry-cli.exe --help

          # windowed GUI exe: must start, serve its API, and stay alive
          # (USBFERRY_GUI_PORT pins the local API port for probing)
          $env:USBFERRY_GUI_PORT = "7590"
          $p = Start-Process -FilePath "dist\usbferry.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "windowed GUI exe exited early" }
          try {
            $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:7590/api/status" -TimeoutSec 5
            if ($r.StatusCode -ne 200) { throw "GUI api status $($r.StatusCode)" }
          } catch { throw "GUI api unreachable: $_" }
          Stop-Process -Id $p.Id -Force
          Remove-Item Env:USBFERRY_GUI_PORT
          "windowed GUI smoke OK"

          # console exe GUI mode: prints its URL and stays alive
          $p2 = Start-Process -FilePath "dist\usbferry-cli.exe" -ArgumentList "gui","--no-window" -PassThru -RedirectStandardOutput "gui-out.txt" -RedirectStandardError "gui-err.txt"
          Start-Sleep -Seconds 10
          if ($p2.HasExited) { Get-Content gui-out.txt, gui-err.txt; throw "cli gui exited early" }
          $out = Get-Content gui-out.txt -Raw
          if ($out -notmatch "127\.0\.0\.1:\d+") { Get-Content gui-out.txt, gui-err.txt; throw "no GUI url in output" }
          Stop-Process -Id $p2.Id -Force
          "cli gui smoke OK"

      - uses: actions/upload-artifact@v4
        with:
          name: usbferry-windows
          path: |
            dist/usbferry.exe
            dist/usbferry-cli.exe
            dist/checksums.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/usbferry.exe
            dist/usbferry-cli.exe
            dist/checksums.txt
